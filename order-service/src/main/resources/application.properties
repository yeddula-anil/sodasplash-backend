spring.application.name=order-service

server.port=${PORT:${ORDER_SERVICE_PORT:8083}}


# ==========================================
# Supabase PostgreSQL - Session Pooler
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${ORDER_DB_USERNAME}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}


# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false


# ==========================================
# HikariCP
# ==========================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.com.sodasplash=DEBUG


# ==========================================
# Delivery Location
# ==========================================

delivery.location.latitude=${DELIVERY_LOCATION_LATITUDE}
delivery.location.longitude=${DELIVERY_LOCATION_LONGITUDE}
delivery.location.max-distance-km=${DELIVERY_LOCATION_MAX_DISTANCE_KM}


# ==========================================
# Geoapify
# ==========================================

geoapify.api-key=${GEOAPIFY_API_KEY}
geoapify.base-url=${GEOAPIFY_BASE_URL:https://api.geoapify.com}


# ==========================================
# Application
# ==========================================

app.frontend-url=${APP_FRONTEND_URL}


# ==========================================
# Product Service
# ==========================================

product-service.url=${PRODUCT_SERVICE_URL}