spring.application.name=product-service

server.port=${PORT:${PRODUCT_SERVICE_PORT:8082}}


# ==========================================
# Supabase PostgreSQL - Session Pooler
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${PRODUCT_DB_USERNAME}
spring.datasource.password=${PRODUCT_DB_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}


# ==========================================
# JPA
# ==========================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false


# ==========================================
# HikariCP
# ==========================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000


# ==========================================
# Logging
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.com.sodasplash=DEBUG


# ==========================================
# Cloudinary
# ==========================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ==========================================
# Application
# ==========================================

app.frontend-url=${APP_FRONTEND_URL}


# ==========================================
# Catalog
# ==========================================

catalog.seed.enabled=${CATALOG_SEED_ENABLED:true}