# =====================================================
# SERVER
# =====================================================

spring.application.name=sodasplash-gateway

server.port=${PORT:${GATEWAY_PORT:8080}}


# =====================================================
# REDIS
# =====================================================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}


# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}


# =====================================================
# ROUTES
# =====================================================

# -----------------------------------------------------
# Auth Service
# -----------------------------------------------------

spring.cloud.gateway.server.webflux.routes[0].id=auth-service

spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL}

spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**


# -----------------------------------------------------
# Product Service
# -----------------------------------------------------

spring.cloud.gateway.server.webflux.routes[1].id=product-service

spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCT_SERVICE_URL}

spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**


# -----------------------------------------------------
# Order Service
# -----------------------------------------------------

spring.cloud.gateway.server.webflux.routes[2].id=order-service

spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL}

spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**


# =====================================================
# GLOBAL CORS
# =====================================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${CORS_ALLOWED_ORIGINS}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=${CORS_ALLOWED_METHODS}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=${CORS_ALLOWED_HEADERS}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposedHeaders=${CORS_EXPOSED_HEADERS}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=${CORS_ALLOW_CREDENTIALS:true}

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=${CORS_MAX_AGE:3600}

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=${CORS_ADD_TO_SIMPLE_URL_HANDLER_MAPPING:true}


# =====================================================
# RATE LIMIT
# =====================================================

gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:100}

gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:100}

gateway.rate-limit.requested-tokens=${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}